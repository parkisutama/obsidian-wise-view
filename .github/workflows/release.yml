name: Release Obsidian plugin

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest_version="$(node -p "require('./manifest.json').version")"

                  if [ "$tag" != "$manifest_version" ]; then
                    echo "Release tag ($tag) must match manifest.json version ($manifest_version)."
                    exit 1
                  fi

            - name: Check and build plugin
              run: pnpm run check:ci

            - name: Package plugin zip
              run: zip wise-view.zip main.js manifest.json styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --generate-notes \
                    main.js manifest.json styles.css wise-view.zip
