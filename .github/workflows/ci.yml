name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Check
              run: pnpm run check:ci
